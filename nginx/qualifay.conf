# Rate limit zone for login brute-force protection
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name 80.225.65.148 _;
    client_max_body_size 50M;

    # Next.js frontend
    location / {
        proxy_pass         http://127.0.1.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # FastAPI backend — general
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Rate-limited login endpoint
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://127.0.0.1:5000/api/v1/auth/login;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # WebSocket (live inbox)
    location /ws {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # Evolution API manager (read-only passthrough, internal only)
    location /evolution/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }

    # ── DEV/TEST stack (development branch) ────────────────────────────────
    # Served under /dev/ on the same port 80 rather than a dedicated public
    # port — the hosting provider's network firewall only allows 80/443/2222
    # through, regardless of ufw rules on the host. The Next.js app itself is
    # built with NEXT_BASE_PATH=/dev (see docker-compose.dev.yml) so its pages,
    # assets, and internal /api rewrite all resolve correctly under this path.
    # Browser calls to /dev/api/* hit the frontend_dev container, which proxies
    # them server-side to backend_dev — nginx never needs to know backend_dev
    # exists.
    location /dev/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
