name: CI

# Runs on every push to the main branches and on pull requests. Goal: catch a broken
# build or a failing test BEFORE it reaches the server. No deploy here — this is the gate.
on:
  push:
    branches: [development, production, main]
  pull_request:
    branches: [development, production, main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  backend-integration:
    name: Backend (integration — Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qualifay_test
          POSTGRES_USER: qualifay
          POSTGRES_PASSWORD: qualifay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qualifay" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      RUN_INTEGRATION: "1"
      DATABASE_URL: postgresql+asyncpg://qualifay:qualifay@127.0.0.1:5432/qualifay_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-secret
      EVOLUTION_API_KEY: ci-evolution
      GROQ_API_KEY: ci
      OPENROUTER_API_KEY: ci
      DEFAULT_ADMIN_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Migrations apply cleanly and match the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      - name: API + end-to-end tests
        working-directory: backend
        run: python -m pytest tests/integration -q

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (compiles + typechecks)
        working-directory: frontend
        # Placeholder public vars so the production build doesn't fail on missing values;
        # the real values are baked at deploy time, not needed to prove the code compiles.
        env:
          NEXT_PUBLIC_API_URL: http://ci.local/api
          NEXT_PUBLIC_WS_URL: ws://ci.local/ws
          NEXT_PUBLIC_SERVER_IP: 127.0.0.1
        run: npm run build
