version: "3.9"

# Qualifay — DEVELOPMENT stack. Runs alongside production on the same server,
# fully isolated data (own Postgres DB + volume, own Redis key prefix), reachable
# on its own ports so you can test the `development` branch online without
# touching what's live on :80/:443.
#
#   Frontend:  http://80.225.65.148:3001
#   Backend:   http://80.225.65.148:5001/api/v1  (docs at /api/docs)
#
# Shared with production (NOT duplicated): Evolution API, Redis server, MinIO,
# Qdrant. Isolation for those comes from REDIS_KEY_PREFIX=qualifay_dev: — but
# WhatsApp sends go through the SAME Evolution instances as production, since
# Evolution isn't duplicated. Don't approve/send real outreach from this stack
# unless you mean to send a real WhatsApp message.

networks:
  qualifay_dev:
    driver: bridge

volumes:
  qualifay_postgres_dev:

services:

  postgres_dev:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: qualifay_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualifay_dev
      POSTGRES_USER: qualifay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - qualifay_postgres_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualifay"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: qualifay_backend_dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 5001 --workers 1 --reload
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://qualifay:${POSTGRES_PASSWORD}@127.0.0.1:5436/qualifay_dev
      REDIS_URL: redis://127.0.0.1:6380
      REDIS_KEY_PREFIX: "qualifay_dev:"
      EVOLUTION_API_URL: http://localhost:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      TOR_PROXY: socks5://127.0.0.1:9050
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      QDRANT_URL: http://127.0.0.1:6333
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@qualifay.io}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://80.225.65.148:3001","http://localhost:3001"]'
      SERVER_IP: 80.225.65.148
    depends_on:
      postgres_dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  celery_dev_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: qualifay_celery_dev
    restart: unless-stopped
    network_mode: host
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q scrape,ai,outreach,default -n dev@%h
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://qualifay:${POSTGRES_PASSWORD}@127.0.0.1:5436/qualifay_dev
      REDIS_URL: redis://127.0.0.1:6380/1
      REDIS_KEY_PREFIX: "qualifay_dev:"
      EVOLUTION_API_URL: http://localhost:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      QDRANT_URL: http://127.0.0.1:6333
      ENVIRONMENT: development
    depends_on:
      postgres_dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://80.225.65.148:5001/api
        NEXT_PUBLIC_WS_URL: ws://80.225.65.148:5001/ws
        NEXT_PUBLIC_SERVER_IP: 80.225.65.148
    platform: linux/arm64
    container_name: qualifay_frontend_dev
    command: sh -c "HOSTNAME=0.0.0.0 PORT=3001 node server.js"
    restart: unless-stopped
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://80.225.65.148:3001
      NEXT_PUBLIC_API_URL: http://80.225.65.148:5001/api
      BACKEND_URL: http://127.0.0.1:5001
      PORT: 3001
      HOSTNAME: 0.0.0.0
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 512M
