version: "3.9"

# Qualifay — New services only
# Existing on server: evolution_api (:8080), redis (:6380), qdrant (:6333), n8n (:5678)
# All new services use network_mode: host to reach them at localhost

networks:
  qualifay:
    driver: bridge

volumes:
  qualifay_postgres:
  qualifay_minio:

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: qualifay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualifay
      POSTGRES_USER: qualifay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - qualifay_postgres:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualifay"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ── MinIO Object Storage ───────────────────────────────────
  minio:
    image: minio/minio:latest
    platform: linux/arm64
    container_name: qualifay_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - qualifay_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [qualifay]
    deploy:
      resources:
        limits:
          memory: 512M

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # backend, celery_worker and celery_beat are the SAME image — same Dockerfile, same
    # context, differing only in `command`. Without a shared tag Compose built and committed
    # the 2.7GB image three times per deploy and kept three byte-identical copies on disk
    # (8.1GB). Sharing one tag means it is built once and the other two resolve from cache.
    image: qualifay-app:latest
    platform: linux/arm64
    container_name: qualifay_backend
    command: uvicorn app.main:app --host 127.0.0.1 --port 5000 --workers 2
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgresql+asyncpg://qualifay:${POSTGRES_PASSWORD}@127.0.0.1:5435/qualifay
      REDIS_URL: redis://127.0.0.1:6380
      EVOLUTION_API_URL: http://localhost:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GROQ_MODEL_REALTIME: ${GROQ_MODEL_REALTIME:-llama-3.3-70b-versatile}
      OPENROUTER_MODEL_REASONING: ${OPENROUTER_MODEL_REASONING:-meta-llama/llama-3.3-70b-instruct:free}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-meta-llama/llama-3.3-70b-instruct:free}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      TOR_PROXY: socks5://127.0.0.1:9050
      PROXY_POOL: ${PROXY_POOL:-}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      QDRANT_URL: http://127.0.0.1:6333
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@qualifay.io}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SERVER_IP: ${SERVER_IP:-80.225.65.148}
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Celery Workers ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qualifay-app:latest       # same image as backend (see note there)
    platform: linux/arm64
    container_name: qualifay_celery
    restart: unless-stopped
    network_mode: host
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=3 -Q scrape,ai,outreach,default
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://qualifay:${POSTGRES_PASSWORD}@127.0.0.1:5435/qualifay
      REDIS_URL: redis://127.0.0.1:6380
      EVOLUTION_API_URL: http://localhost:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GROQ_MODEL_REALTIME: ${GROQ_MODEL_REALTIME:-llama-3.3-70b-versatile}
      OPENROUTER_MODEL_REASONING: ${OPENROUTER_MODEL_REASONING:-meta-llama/llama-3.3-70b-instruct:free}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-meta-llama/llama-3.3-70b-instruct:free}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      TOR_PROXY: socks5://127.0.0.1:9050
      PROXY_POOL: ${PROXY_POOL:-}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      QDRANT_URL: http://127.0.0.1:6333
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Celery Beat (scheduler) ────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qualifay-app:latest       # same image as backend (see note there)
    platform: linux/arm64
    container_name: qualifay_beat
    restart: unless-stopped
    network_mode: host
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://qualifay:${POSTGRES_PASSWORD}@127.0.0.1:5435/qualifay
      REDIS_URL: redis://127.0.0.1:6380
      SECRET_KEY: ${SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Next.js Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP:-80.225.65.148}/api
        NEXT_PUBLIC_WS_URL: ws://${SERVER_IP:-80.225.65.148}/ws
        NEXT_PUBLIC_SERVER_IP: ${SERVER_IP:-80.225.65.148}
        BACKEND_URL: http://127.0.0.1:5000
    platform: linux/arm64
    container_name: qualifay_frontend
    restart: unless-stopped
    # Next 15 standalone binds to os.hostname() by default (resolves to 127.0.1.1 on
    # this host), which nginx (proxying to 127.0.0.1:3000) can't reach. Pin the bind
    # explicitly to loopback:3000. Same quirk the dev frontend already works around.
    command: sh -c "HOSTNAME=127.0.0.1 PORT=3000 node server.js"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://${SERVER_IP:-80.225.65.148}
      NEXT_PUBLIC_API_URL: http://${SERVER_IP:-80.225.65.148}/api
      BACKEND_URL: http://127.0.0.1:5000
      HOSTNAME: 127.0.0.1
      PORT: 3000
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 512M
