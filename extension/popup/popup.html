<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LeadList</title>

<link rel="stylesheet" href="popup.css"/>
</head>
<body>
<div class="popup-wrap">
  <!-- Header -->
  <div class="p-header">
    <div class="p-logo">
      <div class="p-logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="14" width="5" height="8" rx="1.5" fill="white"/>
          <rect x="9.5" y="8" width="5" height="14" rx="1.5" fill="white"/>
          <rect x="17" y="2" width="5" height="20" rx="1.5" fill="white"/>
          <circle cx="4.5" cy="11" r="1.8" fill="white"/>
          <circle cx="19.5" cy="18" r="1.8" fill="white"/>
        </svg>
      </div>
      <div>
        <div class="p-logo-name">LeadList <span class="p-badge">PRO</span></div>
        <div class="p-logo-sub">Email &amp; Phone Scraper</div>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="p-stats">
    <div class="p-stat">
      <div class="p-stat-val" id="statLeads">0</div>
      <div class="p-stat-lbl">Total Leads</div>
    </div>
    <div class="p-stat-divider"></div>
    <div class="p-stat">
      <div class="p-stat-val" id="statEmails">0</div>
      <div class="p-stat-lbl">Emails</div>
    </div>
    <div class="p-stat-divider"></div>
    <div class="p-stat">
      <div class="p-stat-val" id="statPhones">0</div>
      <div class="p-stat-lbl">Phones</div>
    </div>
  </div>

  <!-- Status -->
  <div class="p-status-row" id="statusRow">
    <div class="p-status-dot" id="popStatusDot"></div>
    <span id="popStatusText">Not on LinkedIn</span>
  </div>

  <!-- Actions -->
  <div class="p-actions">
    <button class="p-btn primary" id="btnOpenSidebar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="white" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      Open Scraper Panel
    </button>
    <button class="p-btn secondary" id="btnOpenOptions" style="width:100%;justify-content:center;margin-top:8px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/></svg>
      Automation Settings
    </button>
    <div class="p-btn-row">
      <button class="p-btn secondary" id="btnExportCSV">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3v13m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2"/></svg>
        Export CSV
      </button>
      <button class="p-btn danger" id="btnClearAll">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Clear
      </button>
    </div>
  </div>

  <!-- Recent leads preview -->
  <div class="p-section">
    <div class="p-section-title">Recent Leads</div>
    <div id="recentLeads">
      <div class="p-empty">No leads saved yet.<br/>Open a LinkedIn profile and scrape!</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="p-footer">LeadList v1.0.2 · Email &amp; Phone Scraper</div>
</div>
<script src="popup.js"></script>
</body>
</html>
